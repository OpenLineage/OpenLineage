plugins {
    id 'eclipse'
    id 'jacoco'
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id "com.adarshr.test-logger" version "4.0.0"
    id 'com.diffplug.spotless' version '7.0.2'
    id "com.gradleup.shadow" version "9.6.1"
    id "pmd"
    id "io.freefair.lombok" version "9.8.2"
}

ext {
    projectDescription = "GCP GCS OpenLineage transport library"
}

dependencies {
    implementation('com.google.cloud:google-cloud-storage:2.75.0')

    testImplementation('com.google.cloud:google-cloud-nio:0.139.0')
}

// google-cloud-storage needs the XML stack only for its XML multipart upload API, which this transport does not use.
// Shipping Woodstox breaks hosts that have their own (Hadoop's Configuration fails with NoSuchMethodError), and the
// jar would also register it as the JVM-wide javax.xml.stream provider. If the XML API is ever needed, drop these
// excludes and relocate com.ctc.wstx and com.fasterxml.jackson.dataformat.xml instead.
configurations.configureEach {
    exclude group: 'com.fasterxml.woodstox', module: 'woodstox-core'
    exclude group: 'org.codehaus.woodstox', module: 'stax2-api'
    exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-xml'
}

shadowJar {
    dependencies {
        exclude 'google/**'
        exclude 'grpc/**'
        exclude 'opencensus/**'
        exclude 'com/fasterxml/**'
        exclude 'META-INF/versions/*/com/fasterxml/**'
        exclude 'org/slf4j/**'
    }

    relocate "com.google", "io.openlineage.client.transports.gcs.shaded.com.google"
    relocate "org.checkerframework", "io.openlineage.client.transports.gcs.shaded.org.checkerframework"
    relocate "org.codehaus", "io.openlineage.client.transports.gcs.shaded.org.codehaus"
    relocate "org.conscrypt", "io.openlineage.client.transports.gcs.shaded.org.conscrypt"
    relocate "org.threeten", "io.openlineage.client.transports.gcs.shaded.org.threeten"
    relocate "org.apache", "io.openlineage.client.transports.gcs.shaded.org.apache"
    relocate "io.opencensus", "io.openlineage.client.transports.gcs.shaded.io.opencensus"
    relocate "io.grpc", "io.openlineage.client.transports.gcs.shaded.io.grpc"
    relocate "io.opentelemetry", "io.openlineage.client.transports.gcs.shaded.io.opentelemetry"
    relocate "io.perfmark", "io.openlineage.client.transports.gcs.shaded.io.perfmark"
    relocate "dev.cel", "io.openlineage.client.transports.gcs.shaded.dev.cel"
}

// The shaded jar ends up on host classpaths (Hadoop, HiveServer2, Spark extraClassPath). A third-party class left under
// its original package can shadow the host's own copy, so only OpenLineage classes and the annotation-only JSpecify
// package may stay unrelocated. A failure here usually means a dependency bump brought in a new package: add a
// relocate (or exclude) line to shadowJar above.
tasks.register('verifyShadowJarContents') {
    group = 'verification'
    description = 'Fails if the shaded jar contains unrelocated third-party classes or javax.xml service registrations.'
    def jarFile = tasks.named('shadowJar').flatMap { it.archiveFile }
    def allowedClassPrefixes = ['io/openlineage/', 'org/jspecify/']
    inputs.file(jarFile)
    // jar and shadowJar write the same file (archiveClassifier is '' in transports.build.gradle)
    mustRunAfter tasks.named('jar')
    doLast {
        def offending = new TreeSet<String>()
        new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                def name = entry.name
                def className = name.replaceFirst('^META-INF/versions/[0-9]+/', '')
                if (name.endsWith('.class') && !allowedClassPrefixes.any { className.startsWith(it) }) {
                    def segments = name.split('/')
                    def packageDepth = Math.min(name == className ? 3 : 5, segments.length - 1)
                    offending << (packageDepth == 0 ? name : segments.take(packageDepth).join('/') + '/**')
                }
                if (name.startsWith('META-INF/services/javax.xml.')) {
                    offending << name
                }
            }
        }
        if (!offending.isEmpty()) {
            throw new GradleException("Shaded jar ${jarFile.get().asFile.name} contains entries that can clash with " +
                    "the host classpath. Relocate or exclude them in shadowJar:\n  " + offending.join('\n  '))
        }
    }
}

tasks.named('shadowJar') { finalizedBy 'verifyShadowJarContents' }
tasks.named('check') { dependsOn 'verifyShadowJarContents' }

apply from: '../transports.build.gradle'
