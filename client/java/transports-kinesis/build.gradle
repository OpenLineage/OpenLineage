plugins {
    id 'eclipse'
    id 'jacoco'
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id "com.adarshr.test-logger" version "4.0.0"
    id 'com.diffplug.spotless' version '7.0.2'
    id "com.gradleup.shadow" version "9.6.1"
    id "pmd"
    id "io.freefair.lombok" version "9.8.2"
}

ext {
    projectDescription = "Kinesis OpenLineage transport library"
}

dependencies {
    implementation("software.amazon.kinesis:amazon-kinesis-producer:1.1.0")
    implementation("software.amazon.awssdk:sts:2.56.0")
    implementation("software.amazon.awssdk:auth:2.56.0")
}

apply from: '../transports.build.gradle'
