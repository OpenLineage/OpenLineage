[build-system]
requires = ["uv_build >= 0.12.10, <0.13.0"]
build-backend = "uv_build"

[project]
name = "openlineage-prefect"
version = "0.0.1b8"
description = "OpenLineage integration with Prefect"
readme = "README.md"
authors = [{name = "OpenLineage"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["openlineage", "prefect"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "prefect>=3.8.5",
    "openlineage-python>=1.53.0",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "openlineage-python",
    "pillow",
    "pre-commit",
    "pytest>=8.3",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-env",
    "pytest-timeout>=2.3.1",
    "pytest-xdist",
]

[project.urls]
Homepage = "https://openlineage.io/"
Source = "https://github.com/OpenLineage/OpenLineage/tree/main/integration/prefect"

[tool.bumpversion]
current_version = "0.0.1b8"
commit = false
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?P<rc>.*)"
serialize = [
    "{major}.{minor}.{patch}{rc}",
    "{major}.{minor}.{patch}"
]

[tool.bumpversion.files]
filename = "pyproject.toml"
