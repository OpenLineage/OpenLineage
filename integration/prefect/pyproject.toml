[build-system]
requires = ["uv_build>=0.9.4,<0.12.0"]
build-backend = "uv_build"

[project]
name = "openlineage-prefect"
version = "0.0.1b1"
description = "OpenLineage integration with Prefect"
readme = "README.md"
authors = [{name = "OpenLineage"}]
requires-python = ">=3.10"
keywords = ["openlineage", "prefect"]
dependencies = [
    "prefect>=3.7.0",
    "openlineage-python>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "interrogate",
    "mkdocs",
    "mkdocs-gen-files",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mypy",
    "openlineage-python",
    "pillow",
    "pre-commit",
    "pytest>=8.3",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-env",
    "pytest-timeout>=2.3.1",
    "pytest-xdist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = "."

[tool.bumpversion]
current_version = "0.0.1b1"
commit = false
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?P<rc>.*)"
serialize = [
    "{major}.{minor}.{patch}{rc}",
    "{major}.{minor}.{patch}"
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
