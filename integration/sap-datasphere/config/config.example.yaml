# SAP Datasphere -> OpenLineage: non-secret configuration.
# Copy to config/config.yaml (gitignored) and adjust. Secrets go in .env / VCAP_SERVICES, never here.
# Select the active file with the DS_OL_CONFIG env var (defaults to config/config.yaml, then this example).

scheduler:
  cron: "0 * * * *"        # UTC cron (5- or 6-field). Default: hourly.
  timezone: "UTC"

datasphere:
  # Your own SAP Datasphere tenant. Replace with your host; no real tenant URL ships in this example.
  base_url: "https://your-tenant.your-region.hcs.cloud.sap"
  tenant_host: "your-tenant.your-region.hcs.cloud.sap"   # used to build the OpenLineage namespace
  # OData service root. Default (cookie, works today) is the /dwaas-core service the web UI uses.
  # For the official OAuth API set this to "/api/v1/datasphere/consumption" and auth.type below to
  # oauth2_client_credentials. Base path and auth are independent.
  odata_base_path: "/dwaas-core/odata/v4"
  request_timeout_seconds: 180
  auth:
    type: "cookie"        # cookie | basic | bearer | oauth2_client_credentials
    # Secret material (cookie value, client secret, ...) is resolved from env/.env/VCAP by key,
    # not stored here. See .env.example for the expected keys per auth type.

spaces:
  # If include is non-empty, only these spaces are scanned; exclude is then subtracted.
  include: ["SAP_S4H"]
  exclude: []

lastupdated:
  # Ordered strategies; the first that yields a value wins. Intended semantic: "last time data was written".
  #   monitoring           - real data-write time from the admin/OAuth monitoring API (needs admin; scaffold)
  #   max_timestamp_column - proxy: MAX() of a change-timestamp column via OData (works today)
  #   design_time          - fallback: view deployment_date/modification_date (labeled as definition time)
  strategies: ["max_timestamp_column", "design_time"]
  timestamp_column_patterns:
    - "*LastChanged*"
    - "*LastChangeDateTime*"
    - "*ChangedOn*"
    - "*Timestamp*"
    - "*UpdatedAt*"

openlineage:
  # Standard OpenLineage transport config, passed through to OpenLineageClient (vendor-neutral).
  # Default: console (prints events; safe for local dev). To send events somewhere, point a standard
  # transport at any OpenLineage-compatible backend, e.g. a generic http transport:
  #   transport:
  #     type: "http"
  #     url: "https://<your-openlineage-endpoint>"
  #     auth:
  #       type: "api_key"
  #       api_key: "${OPENLINEAGE_API_KEY}"   # ${VAR} resolved from env/.env/VCAP at runtime
  # See https://openlineage.io/docs/client/python/#transports for all transport types.
  transport:
    type: "console"
  producer: "https://github.com/OpenLineage/OpenLineage"

logging:
  level: "INFO"
