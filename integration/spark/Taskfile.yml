# Tasks for the OpenLineage Spark integration. Included by the root Taskfile
# as `integrations:spark` (alias `spark`).
#
# Secrets/local values for credential-requiring tasks (e.g.
# aws-integration-test) live in .env in this directory (copy .env.template).
# Each such task loads it itself via task-level `dotenv:` (the file-level
# form is forbidden in included Taskfiles), so it works both here and via
# the root catalog; exported environment variables take precedence.
#
# First-time setup: `task setup` (publishes openlineage-java,
# spark-extension-interfaces and openlineage-sql-java to Maven Local, as
# described in https://openlineage.io/docs/development/developing/spark/setup).
#
# Spark/Scala default to the newest CI-tested combination (see vars below);
# override per invocation, e.g.: task test SPARK=3.5.6 SCALA=2.12 JAVA=17
# Run `task versions` to list the supported SPARK/SCALA pairs.
version: '3'

includes:
  java:
    taskfile: ../../client/java/Taskfile.yml
    dir: ../../client/java
    internal: true
  sql:
    taskfile: ../../integration/sql/Taskfile.yml
    dir: ../../integration/sql
    internal: true
  interfaces:
    taskfile: ../spark-extension-interfaces/Taskfile.yml
    dir: ../spark-extension-interfaces
    internal: true

vars:
  # The newest CI-tested Spark/Scala combination. Alternative pairs: run
  # `task versions`, or see the matrix in .circleci/workflows/openlineage-spark.yml.
  DEFAULT_JAVA: "21"
  DEFAULT_SPARK: "4.2.0"
  DEFAULT_SCALA: "2.13"
  CI_DEFAULT_MATRIX: |
    8 3.2.4 2.12
    21 4.2.0 2.13
  CI_FULL_MATRIX: |
    8 3.2.4 2.12
    8 3.2.4 2.13
    8 3.3.4 2.12
    8 3.3.4 2.13
    17 3.3.4 2.12
    17 3.3.4 2.13
    8 3.4.4 2.12
    8 3.4.4 2.13
    8 3.5.6 2.12
    8 3.5.6 2.13
    17 3.5.6 2.12
    17 3.5.6 2.13
    17 4.0.0 2.13
    17 4.2.0 2.13
    21 4.2.0 2.13

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  setup:
    # Pin the JDK for publishing to Maven Local, where a silently wrong JDK
    # poisons every downstream consumer. Task-level env on purpose: global
    # env leaks across included Taskfiles. `JAVA_VERSION=… task …` overrides;
    # see dev/java-home.sh for the resolution order.
    env:
      JAVA_HOME:
        sh: '"$(git rev-parse --show-toplevel)/dev/java-home.sh" 17'
    desc: Build and publish ALL sibling dependencies to Maven Local (openlineage-java, spark-extension-interfaces, openlineage-sql-java)
    cmds:
      - task: setup-java
      - task: setup-interfaces
      - task: setup-sql

  setup-java:
    desc: Republish only openlineage-java to Maven Local (after changing client/java)
    cmds:
      - task: java:publish-local

  setup-interfaces:
    desc: Republish only spark-extension-interfaces to Maven Local
    cmds:
      - task: interfaces:publish-local

  setup-sql:
    desc: Republish only openlineage-sql-java to Maven Local (after changing integration/sql)
    cmds:
      - task: sql:publish-local

  format:
    desc: Apply Spotless formatting to all modules
    cmds:
      - ./gradlew spotlessApply

  lint:
    desc: Verify formatting without building (Spotless check)
    cmds:
      - ./gradlew spotlessCheck

  build:
    desc: Run CI-shaped build command for one version set (SCALA=… to override)
    cmds:
      - |
        ROOT_DIR="$(git rev-parse --show-toplevel)"
        JAVA17_HOME="$("$ROOT_DIR/dev/java-home.sh" 17)"
        ./gradlew --console=plain shadowJar -Pscala.binary.version={{.SCALA | default .DEFAULT_SCALA}} -Pjava.compile.home="$JAVA17_HOME"

  build:ci:
    desc: CI-aligned local build across multiple versions. Default runs JAVA=8/SPARK=3.2.4/SCALA=2.12 and JAVA=21/SPARK=4.2.0/SCALA=2.13. Set FULL=true for all matrix combinations.
    silent: true
    cmds:
      - |
        set -euo pipefail
        ROOT_DIR="$(git rev-parse --show-toplevel)"
        JAVA17_HOME="$("$ROOT_DIR/dev/java-home.sh" 17)"
        if [ -n "{{.JAVA}}" ] || [ -n "{{.SPARK}}" ] || [ -n "{{.SCALA}}" ]; then
          echo "ERROR: build:ci does not accept JAVA/SPARK/SCALA overrides. Use build/test/integration-test for single-version runs." >&2
          exit 1
        fi
        run_one() {
          local java="$1"
          local spark="$2"
          local scala="$3"
          printf '\033[1;34m[%s/%s] ./gradlew --console=plain shadowJar -Pspark.version=%s -Pscala.binary.version=%s -Pjava.compile.home=%s\033[0m\n' "$idx" "$total" "$spark" "$scala" "$JAVA17_HOME"
          ./gradlew --console=plain shadowJar -Pspark.version="$spark" -Pscala.binary.version="$scala" -Pjava.compile.home="$JAVA17_HOME"
        }
        if [ "{{.FULL | default "false"}}" = "true" ]; then
          matrix='{{.CI_FULL_MATRIX}}'
        else
          matrix='{{.CI_DEFAULT_MATRIX}}'
        fi
        total="$(printf '%s\n' "$matrix" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
        idx=0
        while read -r java spark scala; do
          [ -z "${java:-}" ] && continue
          idx=$((idx + 1))
          run_one "$java" "$spark" "$scala"
        done <<< "$matrix"

  test:
    desc: Run CI-shaped test command for one version set (JAVA=… SPARK=… SCALA=… to override, TESTS=… to pass --tests)
    cmds:
      - |
        ROOT_DIR="$(git rev-parse --show-toplevel)"
        JAVA17_HOME="$("$ROOT_DIR/dev/java-home.sh" 17)"
        JAVA_TEST_HOME="$("$ROOT_DIR/dev/java-home.sh" {{.JAVA | default .DEFAULT_JAVA}})"
        {{if .TESTS}}
        ./gradlew --no-daemon --console=plain --stacktrace test --tests "{{.TESTS}}" -Pspark.version={{.SPARK | default .DEFAULT_SPARK}} -Pscala.binary.version={{.SCALA | default .DEFAULT_SCALA}} -Pjava.compile.home="$JAVA17_HOME" -Papp.java.test.home="$JAVA_TEST_HOME" -Pspark.docker.java.version={{.JAVA | default .DEFAULT_JAVA}}
        {{else}}
        ./gradlew --no-daemon --console=plain --stacktrace build check -Pspark.version={{.SPARK | default .DEFAULT_SPARK}} -Pscala.binary.version={{.SCALA | default .DEFAULT_SCALA}} -Pjava.compile.home="$JAVA17_HOME" -Papp.java.test.home="$JAVA_TEST_HOME" -Pspark.docker.java.version={{.JAVA | default .DEFAULT_JAVA}}
        {{end}}

  test:ci:
    desc: CI-aligned local test across multiple versions. Default runs JAVA=8/SPARK=3.2.4/SCALA=2.12 and JAVA=21/SPARK=4.2.0/SCALA=2.13. Set FULL=true for all matrix combinations. Optionally set TESTS=… to pass --tests.
    silent: true
    cmds:
      - |
        set -euo pipefail
        ROOT_DIR="$(git rev-parse --show-toplevel)"
        JAVA17_HOME="$("$ROOT_DIR/dev/java-home.sh" 17)"
        if [ -n "{{.JAVA}}" ] || [ -n "{{.SPARK}}" ] || [ -n "{{.SCALA}}" ]; then
          echo "ERROR: test:ci does not accept JAVA/SPARK/SCALA overrides. Use test for single-version runs." >&2
          exit 1
        fi
        run_one() {
          local java="$1"
          local spark="$2"
          local scala="$3"
          local java_test_home
          java_test_home="$("$ROOT_DIR/dev/java-home.sh" "$java")"
          {{if .TESTS}}
          printf '\033[1;34m[%s/%s] ./gradlew --no-daemon --console=plain --stacktrace test --tests "%s" -Pspark.version=%s -Pscala.binary.version=%s -Pjava.compile.home=%s -Papp.java.test.home=%s -Pspark.docker.java.version=%s\033[0m\n' "$idx" "$total" "{{.TESTS}}" "$spark" "$scala" "$JAVA17_HOME" "$java_test_home" "$java"
          ./gradlew --no-daemon --console=plain --stacktrace test --tests "{{.TESTS}}" -Pspark.version="$spark" -Pscala.binary.version="$scala" -Pjava.compile.home="$JAVA17_HOME" -Papp.java.test.home="$java_test_home" -Pspark.docker.java.version="$java"
          {{else}}
          printf '\033[1;34m[%s/%s] ./gradlew --no-daemon --console=plain --stacktrace build check -Pspark.version=%s -Pscala.binary.version=%s -Pjava.compile.home=%s -Papp.java.test.home=%s -Pspark.docker.java.version=%s\033[0m\n' "$idx" "$total" "$spark" "$scala" "$JAVA17_HOME" "$java_test_home" "$java"
          ./gradlew --no-daemon --console=plain --stacktrace build check -Pspark.version="$spark" -Pscala.binary.version="$scala" -Pjava.compile.home="$JAVA17_HOME" -Papp.java.test.home="$java_test_home" -Pspark.docker.java.version="$java"
          {{end}}
        }
        if [ "{{.FULL | default "false"}}" = "true" ]; then
          matrix='{{.CI_FULL_MATRIX}}'
        else
          matrix='{{.CI_DEFAULT_MATRIX}}'
        fi
        total="$(printf '%s\n' "$matrix" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
        idx=0
        while read -r java spark scala; do
          [ -z "${java:-}" ] && continue
          idx=$((idx + 1))
          run_one "$java" "$spark" "$scala"
        done <<< "$matrix"

  integration-test:
    desc: Run CI-shaped integration test command for one version set (JAVA=… SPARK=… SCALA=… to override, TESTS=… to pass --tests)
    cmds:
      - |
        ROOT_DIR="$(git rev-parse --show-toplevel)"
        JAVA17_HOME="$("$ROOT_DIR/dev/java-home.sh" 17)"
        JAVA_TEST_HOME="$("$ROOT_DIR/dev/java-home.sh" {{.JAVA | default .DEFAULT_JAVA}})"
        ./gradlew --no-daemon --console=plain integrationTest -x test -Pspark.version={{.SPARK | default .DEFAULT_SPARK}} -Pscala.binary.version={{.SCALA | default .DEFAULT_SCALA}} -Pjava.compile.home="$JAVA17_HOME" -Papp.java.test.home="$JAVA_TEST_HOME" -Pspark.docker.java.version={{.JAVA | default .DEFAULT_JAVA}} {{if .TESTS}} --tests "{{.TESTS}}"{{end}}

  integration-test:ci:
    desc: CI-aligned local integration test across multiple versions. Default runs JAVA=8/SPARK=3.2.4/SCALA=2.12 and JAVA=21/SPARK=4.2.0/SCALA=2.13. Set FULL=true for all matrix combinations. Optionally set TESTS=… to pass --tests.
    silent: true
    cmds:
      - |
        set -euo pipefail
        ROOT_DIR="$(git rev-parse --show-toplevel)"
        JAVA17_HOME="$("$ROOT_DIR/dev/java-home.sh" 17)"
        if [ -n "{{.JAVA}}" ] || [ -n "{{.SPARK}}" ] || [ -n "{{.SCALA}}" ]; then
          echo "ERROR: integration-test:ci does not accept JAVA/SPARK/SCALA overrides. Use integration-test for single-version runs." >&2
          exit 1
        fi
        run_one() {
          local java="$1"
          local spark="$2"
          local scala="$3"
          local java_test_home
          java_test_home="$("$ROOT_DIR/dev/java-home.sh" "$java")"
          printf '\033[1;34m[%s/%s] ./gradlew --no-daemon --console=plain integrationTest -x test -Pspark.version=%s -Pscala.binary.version=%s -Pjava.compile.home=%s -Papp.java.test.home=%s -Pspark.docker.java.version=%s%s\033[0m\n' "$idx" "$total" "$spark" "$scala" "$JAVA17_HOME" "$java_test_home" "$java" "{{if .TESTS}} --tests \"{{.TESTS}}\"{{end}}"
          ./gradlew --no-daemon --console=plain integrationTest -x test -Pspark.version="$spark" -Pscala.binary.version="$scala" -Pjava.compile.home="$JAVA17_HOME" -Papp.java.test.home="$java_test_home" -Pspark.docker.java.version="$java" {{if .TESTS}} --tests "{{.TESTS}}"{{end}}
        }
        if [ "{{.FULL | default "false"}}" = "true" ]; then
          matrix='{{.CI_FULL_MATRIX}}'
        else
          matrix='{{.CI_DEFAULT_MATRIX}}'
        fi
        total="$(printf '%s\n' "$matrix" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
        idx=0
        while read -r java spark scala; do
          [ -z "${java:-}" ] && continue
          idx=$((idx + 1))
          run_one "$java" "$spark" "$scala"
        done <<< "$matrix"

  versions:
    desc: List the Spark/Scala pairs usable as SPARK=… SCALA=… overrides (the CI-tested matrix)
    silent: true
    cmds:
      - 'echo "Default (newest CI-tested): SPARK={{.DEFAULT_SPARK}} SCALA={{.DEFAULT_SCALA}}"'
      - 'echo "CI-tested pairs (from .circleci/workflows/openlineage-spark.yml):"'
      - 'grep -o "spark:[0-9][0-9.]*-scala:[0-9][0-9.]*" ../../.circleci/workflows/openlineage-spark.yml | sort -u -V | sed -E "s/spark:([0-9.]+)-scala:([0-9.]+)/  SPARK=\1 SCALA=\2/"'

  jar:
    desc: 'Build the OpenLineage Spark agent shadow jar, skipping tests; extra Gradle args after "--"'
    cmds:
      - ./gradlew shadowJar -x test {{.CLI_ARGS}}

  jar:verify:
    # Mirrors the CI invocation (clean build, then verify) so a green run here
    # means a green jarVerification in CI. CI pins SCALA=2.12; override to match
    # exactly. jarVerification dependsOn shadowJar + jar, so it builds the jar.
    desc: 'Build the agent shadow jar and run jarVerification — the jar-content check CI runs (SPARK=… SCALA=… to override versions)'
    cmds:
      - ./gradlew clean jarVerification -Pspark.version={{.SPARK | default .DEFAULT_SPARK}} -Pscala.binary.version={{.SCALA | default .DEFAULT_SCALA}}

  aws-integration-test:
    desc: 'Run AWS EMR integration tests — needs AWS credentials in the environment plus BUCKET (s3 bucket) and SUBNET (ec2 subnet id) exported or set in integration/spark/.env; extra -Dopenlineage.tests.emr.* params after "--"'
    dotenv: ['.env']
    preconditions:
      - sh: test -n "$BUCKET"
        msg: 'BUCKET (s3 bucket name) is not set — fill it in integration/spark/.env or export it'
      - sh: test -n "$SUBNET"
        msg: 'SUBNET (ec2 subnet id) is not set — fill it in integration/spark/.env or export it'
    cmds:
      - ./gradlew awsIntegrationTest --info -x test -Dopenlineage.tests.emr.bucketName="$BUCKET" -Dopenlineage.tests.emr.ec2SubnetId="$SUBNET" {{.CLI_ARGS}}

  abfss-test:
    desc: 'Run the Azure ADLS Gen2 (abfss) Unity Catalog integration tests'
    dotenv: ['.env']
    cmds:
      - ./gradlew :spark40:executeTestScala213 -Pazure --tests '*Abfss*' {{.CLI_ARGS}}

  quickstart:start:
    desc: Start the local playground — Jupyter+PySpark (localhost:8888, token in logs) with Marquez UI (localhost:3000); app/build is mounted, so run 'task jar' first to try a locally built agent
    cmds:
      - docker compose up --detach
      - docker compose logs notebook | grep -m1 "127.0.0.1:8888" || true

  quickstart:down:
    desc: Stop the local playground and remove its containers
    cmds:
      - docker compose down
