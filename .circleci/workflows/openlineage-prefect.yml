workflows:
  openlineage-prefect:
    jobs:
      - unit-test-integration-prefect:
          filters:
            tags:
              only: /^[0-9]+(\.[0-9]+){2}(-rc\.[0-9]+)?$/
      - workflow_complete:
          requires:
            - unit-test-integration-prefect
